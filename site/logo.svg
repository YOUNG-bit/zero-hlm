  <path d="M120 31c50.6 0 88 36.7 88 89s-37.4 89-88 89-88-36.7-88-89 37.4-89 88-89Zm0 31c-31.8 0-54.5 23.2-54.5 58S88.2 178 120 178s54.5-23.2 54.5-58S151.8 62 120 62Z" fill="url(#outer)" opacity=".96"/>
