<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Zero-HLM logo</title>
  <desc id="desc">A zero-shaped bridge linking simulation and real-world trajectories.</desc>
  <defs>
    <linearGradient id="outer" x1="28" y1="30" x2="212" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4d693"/>
      <stop offset="0.45" stop-color="#71d9d3"/>
      <stop offset="1" stop-color="#1d5f66"/>
    </linearGradient>
    <linearGradient id="trailA" x1="50" y1="155" x2="185" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6cf82" stop-opacity="0.18"/>
